<!DOCTYPE html>
<html lang="hu">

<head>
   <meta charset="UTF-8">

   <meta
       name="viewport"
       content="width=device-width, initial-scale=1.0">


   <title>MiniQue 3D babaszoba</title>

   <style>
       * {
           box-sizing: border-box;
       }

       html,
       body {
           width: 100%;
           height: 100%;
           margin: 0;
       }

       body {
           overflow: hidden;
           background: #f5f2ec;
           font-family: Arial, sans-serif;
       }

       #three-d-room {
           width: 100%;
           height: 100%;
       }

       #three-d-room canvas {
           display: block;
           width: 100%;
           height: 100%;
       }

       .room-title {
           position: fixed;
           top: 20px;
           left: 50%;
           z-index: 10;
           transform: translateX(-50%);
           margin: 0;
           padding: 11px 20px;
           border-radius: 999px;
           background: rgba(255, 255, 255, 0.9);
           color: #315f55;
           font-size: 18px;
           box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
           backdrop-filter: blur(8px);
       }

       .room-help {
           position: fixed;
           bottom: 20px;
           left: 50%;
           z-index: 10;
           transform: translateX(-50%);
           padding: 10px 16px;
           border-radius: 999px;
           background: rgba(49, 95, 85, 0.92);
           color: #ffffff;
           font-size: 13px;
           text-align: center;
       }
   </style>

   <script type="importmap">
       {
           "imports": {
               "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
           }
       }
   </script>
</head>

<body>

   <h1 class="room-title">
       MiniQue 3D babaszoba
   </h1>

   <div
       id="three-d-room"
       aria-label="Háromdimenziós babaszoba">
</div>

   <div class="room-help">
       Forgatás: húzd az egeret · Nagyítás: görgő
   </div>

   <script type="module">
       import * as THREE from "three";

       import {
           OrbitControls
       } from "three/addons/controls/OrbitControls.js";


       const container =
           document.getElementById("three-d-room");


       /*
        * JELENET
        */

       const scene = new THREE.Scene();

       scene.background =
           new THREE.Color(0xf5f2ec);


       /*
        * KAMERA
        */

       const camera =
           new THREE.PerspectiveCamera(
               45,
               window.innerWidth / window.innerHeight,
               0.1,
               100
           );

       camera.position.set(7, 4.8, 8);


       /*
        * MEGJELENÍTŐ
        */

       const renderer =
           new THREE.WebGLRenderer({
               antialias: true
           });

       renderer.setPixelRatio(
           Math.min(window.devicePixelRatio, 2)
       );

       renderer.setSize(
           window.innerWidth,
           window.innerHeight
       );

       renderer.shadowMap.enabled = true;

       renderer.shadowMap.type =
           THREE.PCFSoftShadowMap;

       renderer.outputColorSpace =
           THREE.SRGBColorSpace;

       container.appendChild(
           renderer.domElement
       );


       /*
        * KAMERAVEZÉRLÉS
        */

       const controls =
           new OrbitControls(
               camera,
               renderer.domElement
           );

       controls.target.set(0, 1.4, -0.2);

       controls.enableDamping = true;

       controls.dampingFactor = 0.06;

       controls.enablePan = false;

       controls.minDistance = 5;

       controls.maxDistance = 14;

       controls.minPolarAngle =
           THREE.MathUtils.degToRad(42);

       controls.maxPolarAngle =
           THREE.MathUtils.degToRad(82);

       controls.update();


       /*
        * SZOBAMÉRETEK
        */

       const roomWidth = 6;
       const roomHeight = 3.2;
       const roomDepth = 5;


       /*
        * ANYAGOK
        */

       const wallMaterial =
           new THREE.MeshStandardMaterial({
               color: 0xeee8df,
               roughness: 0.9,
               metalness: 0,
               side: THREE.DoubleSide
           });

       const floorMaterial =
           new THREE.MeshStandardMaterial({
               color: 0xc9a982,
               roughness: 0.78,
               metalness: 0,
               side: THREE.DoubleSide
           });


       /*
        * PADLÓ
        */

       const floorGeometry =
           new THREE.PlaneGeometry(
               roomWidth,
               roomDepth
           );

       const floor =
           new THREE.Mesh(
               floorGeometry,
               floorMaterial
           );

       floor.rotation.x =
           -Math.PI / 2;

       floor.position.set(
           0,
           0,
           0
       );

       floor.receiveShadow = true;

       scene.add(floor);


       /*
        * HÁTSÓ FAL
        */

       const backWallGeometry =
           new THREE.PlaneGeometry(
               roomWidth,
               roomHeight
           );

       const backWall =
           new THREE.Mesh(
               backWallGeometry,
               wallMaterial
           );

       backWall.position.set(
           0,
           roomHeight / 2,
           -roomDepth / 2
       );

       backWall.receiveShadow = true;

       scene.add(backWall);


       /*
        * BAL OLDALFAL
        */

       const sideWallGeometry =
           new THREE.PlaneGeometry(
               roomDepth,
               roomHeight
           );

       const leftWall =
           new THREE.Mesh(
               sideWallGeometry,
               wallMaterial
           );

       leftWall.rotation.y =
           Math.PI / 2;

       leftWall.position.set(
           -roomWidth / 2,
           roomHeight / 2,
           0
       );

       leftWall.receiveShadow = true;

       scene.add(leftWall);


       /*
        * JOBB OLDALFAL
        */

       const rightWall =
           new THREE.Mesh(
               sideWallGeometry,
               wallMaterial
           );

       rightWall.rotation.y =
           -Math.PI / 2;

       rightWall.position.set(
           roomWidth / 2,
           roomHeight / 2,
           0
       );

       rightWall.receiveShadow = true;

       scene.add(rightWall);


       /*
        * SZEGŐLÉCEK
        */

       const skirtingMaterial =
           new THREE.MeshStandardMaterial({
               color: 0xffffff,
               roughness: 0.8
           });

       function createSkirting(
           width,
           height,
           depth,
           x,
           y,
           z
       ) {
           const geometry =
               new THREE.BoxGeometry(
                   width,
                   height,
                   depth
               );

           const skirting =
               new THREE.Mesh(
                   geometry,
                   skirtingMaterial
               );

           skirting.position.set(
               x,
               y,
               z
           );

           skirting.castShadow = true;
           skirting.receiveShadow = true;

           scene.add(skirting);
       }

       createSkirting(
           roomWidth,
           0.12,
           0.08,
           0,
           0.06,
           -roomDepth / 2 + 0.04
       );

       createSkirting(
           0.08,
           0.12,
           roomDepth,
           -roomWidth / 2 + 0.04,
           0.06,
           0
       );

       createSkirting(
           0.08,
           0.12,
           roomDepth,
           roomWidth / 2 - 0.04,
           0.06,
           0
       );


       /*
        * PRÓBABÚTOR
        */

       const furnitureMaterial =
           new THREE.MeshStandardMaterial({
               color: 0xd7c1a7,
               roughness: 0.72
           });

       const furnitureGeometry =
           new THREE.BoxGeometry(
               1.8,
               0.75,
               0.85
           );

       const furniture =
           new THREE.Mesh(
               furnitureGeometry,
               furnitureMaterial
           );

       furniture.position.set(
           0,
           0.375,
           -1.65
       );

       furniture.castShadow = true;
       furniture.receiveShadow = true;

       scene.add(furniture);


       /*
        * FÉNYEK
        */

       const hemisphereLight =
           new THREE.HemisphereLight(
               0xffffff,
               0xb8aa98,
               1.8
           );

       scene.add(hemisphereLight);


       const mainLight =
           new THREE.DirectionalLight(
               0xffffff,
               2.4
           );

       mainLight.position.set(
           3,
           6,
           4
       );

       mainLight.castShadow = true;

       mainLight.shadow.mapSize.set(
           2048,
           2048
       );

       mainLight.shadow.camera.left = -7;
       mainLight.shadow.camera.right = 7;
       mainLight.shadow.camera.top = 7;
       mainLight.shadow.camera.bottom = -7;

       scene.add(mainLight);


       /*
        * ABLAK ÁTMÉRETEZÉSE
        */

       window.addEventListener(
           "resize",
           function () {
               camera.aspect =
                   window.innerWidth /
                   window.innerHeight;

               camera.updateProjectionMatrix();

               renderer.setSize(
                   window.innerWidth,
                   window.innerHeight
               );
           }
       );


       /*
        * ANIMÁCIÓ
        */

       function animate() {
           requestAnimationFrame(animate);

           controls.update();

           renderer.render(
               scene,
               camera
           );
       }

       animate();
   </script>

</body>

</html>
